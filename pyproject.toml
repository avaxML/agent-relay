[project]
name = "agent-relay"
version = "0.1.0"
description = "Delegate bounded coding work to local coding-agent CLIs."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "avaxML" }]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15,<3",
  "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts"]
cache_dir = ".mypy_cache"
